<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC3 Web</title>
<meta name="description" content="A browser re-implementation of the PAC3 outfit editor: build outfits from models, effects, events and proxies on a 3D mannequin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='13' fill='white' text-anchor='middle'%3EPAC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="menubar"></header>
  <aside id="sidebar" aria-label="Outfit editor">
    <section id="tree-panel">
      <div class="panel-title"><span>Outfit</span><button id="add-btn" class="icon-btn" type="button" title="Add part" aria-label="Add part">＋</button></div>
      <div id="tree" role="tree" aria-label="Outfit parts"></div>
    </section>
    <div id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize panels"></div>
    <section id="props-panel" aria-label="Properties"><div id="props"></div></section>
  </aside>
  <main id="viewport">
    <canvas id="canvas" tabindex="0" aria-label="3D view"></canvas>
    <div id="vp-toolbar"></div>
    <div id="hud"></div>
  </main>
</div>
<noscript><p class="fatal">PAC3 Web needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
